    <text class="field" x="595" y="155">PK employee_id : bigint</text>
    <text class="field" x="595" y="195">full_name : text</text>
    <text class="field" x="595" y="235">position : text</text>
    <text class="field" x="595" y="275">active : boolean</text>

    <rect class="header" x="1100" y="50" width="460" height="65" />
    <rect class="body" x="1100" y="105" width="460" height="215" />
    <text class="title" x="1125" y="91">menu_category</text>
    <text class="field" x="1125" y="155">PK category_id : bigint</text>
    <text class="field" x="1125" y="195">UQ category_name : text</text>

    <rect class="header" x="50" y="420" width="650" height="310" />
