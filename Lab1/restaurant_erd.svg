<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52647a" />
    </marker>
    <style>
      .body { fill:#fff; stroke:#52647a; stroke-width:2.5; rx:11; }
      .header { fill:#e7eef7; stroke:#52647a; stroke-width:2.5; rx:11; }
      .title { font:bold 25px Arial,sans-serif; fill:#18324d; }
      .field { font:19px Arial,sans-serif; fill:#24364b; }
      .edge { fill:none; stroke:#52647a; stroke-width:3; marker-end:url(#arrow); }
      .card { font:bold 17px Arial,sans-serif; fill:#34495e; }
    </style>
  </defs>
  <g class="edge">
    <path d="M270 320 L270 420" />
    <path d="M800 320 L800 365 L650 420" />
    <path d="M1330 320 L1330 420" />
    <path d="M500 730 L660 870" />
    <path d="M1100 760 L940 870" />
  </g>
  <g class="card">
